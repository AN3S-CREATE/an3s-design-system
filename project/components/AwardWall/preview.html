<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AwardWall — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap">
<style>
  body { background: var(--deep-space); }
  .stage { box-sizing: border-box; padding: var(--space-5); }
</style>
</head>
<body>
<div id="root" class="stage"></div>
<script>
  var A = window.AN3S, h = React.createElement;
  var awards = [
    { name: 'Africa CEO Forum Awards' },
    { name: 'Young Entrepreneur of the Year', detail: 'YE Awards 2019' },
    { name: 'South African Small Business Awards' },
    { name: 'National Presidential Small & Cooperatives Awards', detail: '2016' },
    { name: 'EY Entrepreneur Of The Year' },
    { name: 'The South African Future Trust Awards', detail: '2025' },
    { name: 'Absa Supplier Development Award' },
    { name: 'BCX Digital Innovation Awards' }
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h(A.AwardWall, { items: awards }));
</script>
</body>
</html>
